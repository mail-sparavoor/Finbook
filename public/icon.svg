<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="8"/>
  
  <!-- Book / Finance Logo Symbol -->
  <g transform="translate(106, 106)" filter="url(#shadow)">
    <!-- Book Left Page -->
    <path d="M150 250 C80 230 40 240 20 255 L20 60 C40 45 80 35 150 55 Z" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Book Right Page -->
    <path d="M150 250 C220 230 260 240 280 255 L280 60 C260 45 220 35 150 55 Z" fill="#ffffff"/>
    <!-- Center Spine -->
    <line x1="150" y1="55" x2="150" y2="250" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Indian Rupee / Currency Accent on Right Page -->
    <g transform="translate(190, 115) scale(0.9)" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 10 L50 10"/>
      <path d="M10 24 L50 24"/>
      <path d="M10 10 L25 10 C45 10 45 42 25 42 L10 42 L45 78"/>
    </g>
  </g>
</svg>
